<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RoboClub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sign Up Page -->
    <div class="auth-page">
        <div class="auth-container signup-container">
            <div class="auth-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <h2>Join Our Club</h2>
                <p>Create your account and start building</p>
            </div>

            <div id="signupMessage"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name *</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="signupName" class="form-input" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password *</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="signupPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password *</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Re-enter password" required minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <input type="tel" id="signupPhone" class="form-input" placeholder="+1234567890">
                    </div>
                </div>
            </div>

            <div class="address-section">
                <div class="address-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <h3>Address (Optional)</h3>
                </div>

                <div class="form-grid">
                    <input type="text" id="signupStreet" class="form-input" placeholder="Street">
                    <input type="text" id="signupCity" class="form-input" placeholder="City">
                    <input type="text" id="signupZipCode" class="form-input" placeholder="Zip Code">
                    <input type="text" id="signupCountry" class="form-input" placeholder="Country">
                </div>
            </div>

            <button class="btn btn-primary" style="width: 100%; margin-top: 24px;" onclick="handleSignup()">Sign Up</button>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" style="color: #a855f7; font-weight: 700; text-decoration: none;">Log In</a></p>
                <a href="home.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
