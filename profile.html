<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboClub - Profile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Profile Page -->
    <div id="profilePage" class="dashboard-page">
        <nav>
            <div class="nav-container">
                <div class="nav-logo" onclick="window.location.href='dashboard.html'">
                    <i data-lucide="cpu"></i>
                    <span>RoboClub Profile</span>
                </div>
                
                <div class="nav-links">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="dashboard.html">Robots</a>
                    <a href="dashboard.html">Quiz</a>
                    <a class="active">Profile</a>
                    <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
                </div>

                <button class="menu-toggle" onclick="toggleMenu()">
                    <i data-lucide="menu" id="menuIcon3"></i>
                </button>
            </div>

            <div class="mobile-menu" id="mobileMenu3">
                <div class="mobile-menu-content">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="dashboard.html">Robots</a>
                    <a href="dashboard.html">Quiz</a>
                    <a class="active">Profile</a>
                    <button class="btn btn-danger" style="width: 100%;" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </nav>

        <div class="dashboard-container">
            <div class="dashboard-header">
                <h1>Your Profile, <span id="userName">Member</span>!</h1>
                <p>Manage your personal information and settings</p>
            </div>

            <div class="dashboard-content">
                <h2 class="section-title">Your Profile</h2>
                
                <div class="profile-section">
                    <h3><i data-lucide="user"></i> Personal Information</h3>
                    <div id="profileMessage"></div>
                    <div class="profile-info" id="profileInfo">
                        <div class="info-item">
                            <label>Full Name</label>
                            <p id="profileName">-</p>
                        </div>
                        <div class="info-item">
                            <label>Email</label>
                            <p id="profileEmail">-</p>
                        </div>
                        <div class="info-item">
                            <label>Phone</label>
                            <p id="profilePhone">-</p>
                        </div>
                        <div class="info-item">
                            <label>Member Since</label>
                            <p id="profileJoined">-</p>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="margin-top: 1rem;" onclick="toggleEditMode()">Edit Profile</button>
                </div>

                <div class="profile-section">
                    <h3><i data-lucide="map-pin"></i> Address Information</h3>
                    <div class="profile-info" id="addressInfo">
                        <div class="info-item">
                            <label>Street</label>
                            <p id="profileStreet">-</p>
                        </div>
                        <div class="info-item">
                            <label>City</label>
                            <p id="profileCity">-</p>
                        </div>
                        <div class="info-item">
                            <label>Zip Code</label>
                            <p id="profileZip">-</p>
                        </div>
                        <div class="info-item">
                            <label>Country</label>
                            <p id="profileCountry">-</p>
                        </div>
                    </div>
                </div>

                <div class="profile-section">
                    <h3><i data-lucide="lock"></i> Change Password</h3>
                    <div id="passwordMessage"></div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Current Password</label>
                            <input type="password" id="currentPassword" class="form-input" placeholder="Enter current password">
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" id="newPassword" class="form-input" placeholder="Enter new password">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
                </div>

                <div class="profile-section">
                    <h3><i data-lucide="settings"></i> Account Actions</h3>
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <button class="btn btn-secondary" onclick="exportUserData()">
                            <i data-lucide="download"></i> Export My Data
                        </button>
                        <button class="btn btn-danger" onclick="deleteAccount()">
                            <i data-lucide="trash-2"></i> Delete Account
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Additional initialization for profile page
        document.addEventListener('DOMContentLoaded', function() {
            // Ensure profile data is loaded when the page is ready
            setTimeout(() => {
                if (window.location.pathname.includes('profile.html')) {
                    console.log('Profile page loaded, initializing data...');
                    loadProfileData();
                }
            }, 100);
        });
    </script>
</body>
</html>
