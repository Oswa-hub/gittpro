<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RoboClub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Page -->
    <div class="auth-page">
        <div class="auth-container login-container">
            <div class="auth-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <h2>Welcome Back</h2>
                <p>Log in to access your account</p>
            </div>

            <div id="loginMessage"></div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••">
                </div>
            </div>

            <button class="btn btn-primary" style="width: 100%;" onclick="handleLogin()">Log In</button>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" style="color: #a855f7; font-weight: 700; text-decoration: none;">Sign Up</a></p>
                <a href="home.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Add Enter key support for login
        document.addEventListener('DOMContentLoaded', function() {
            const loginPassword = document.getElementById('loginPassword');
            if (loginPassword) {
                loginPassword.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        handleLogin();
                    }
                });
            }
        });
    </script>
</body>
</html>
